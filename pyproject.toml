[project]
name = "heretic-mlx"
version = "0.1.0"
description = "MLX-native Heretic 2.2 (ARA + MPOA) for Apple Silicon with MXFP4 and oQ support"
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.10"
dependencies = [
    "datasets>=3.0",
    "huggingface-hub>=0.26",
    "mlx>=0.30",
    "mlx-lm>=0.30",
    "numpy>=2.0",
    "optuna>=4.0",
    "pydantic>=2.0",
    "questionary>=2.0",
    "rich>=13.0",
    "safetensors>=0.4",
    "scipy>=1.13",
    "tqdm>=4.60",
]

[project.optional-dependencies]
classifier = ["torch>=2.6"]
eval = ["lm-eval>=0.4"]
dev = ["pytest>=8.0", "ruff>=0.15"]

[project.urls]
Homepage = "https://github.com/scoltzero/heretic-mlx"
Repository = "https://github.com/scoltzero/heretic-mlx"
Issues = "https://github.com/scoltzero/heretic-mlx/issues"
Upstream = "https://github.com/p-e-w/heretic"

[project.scripts]
heretic-mlx = "heretic_mlx.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/heretic_mlx"]

[tool.ruff.lint]
ignore = [
    "BLE001",  # Deliberate broad fallback for optional chat_template / batch_generate / type hints
]
